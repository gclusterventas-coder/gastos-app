<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos App Pro</title>
<style>
:root{--bg:#0b0b0c;--card:#1c1c1f;--border:#2c2c2f;--text:#fff;--muted:#9a9a9a;--green:#22c55e}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
.app{max-width:420px;margin:auto;padding:14px}
.header{display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;padding:10px;border:1px solid var(--border);background:#181818;color:#aaa;border-radius:10px;cursor:pointer}
.tab.active{background:#232323;color:#fff}
.card{background:var(--card);padding:10px;border-radius:12px;border:1px solid var(--border);margin-bottom:10px}
.item{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
.add{border:1px dashed var(--border);padding:10px;text-align:center;border-radius:10px;cursor:pointer;color:#aaa}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center}
.modal-inner{background:#1c1c1f;padding:16px;border-radius:12px;width:260px}
input,select{width:100%;margin-bottom:8px;padding:8px;border:none;border-radius:6px}
button{width:100%;padding:8px}
</style>
</head>
<body>
<div class="app">
<div class="header"><h3>💑 gastos</h3><span>mayo</span></div>
<div class="tabs">
<button class="tab active" onclick="setTab('yo',this)">yo</button>
<button class="tab" onclick="setTab('ella',this)">ella</button>
<button class="tab" onclick="setTab('proy',this)">proyección</button>
</div>
<div id="content"></div>
<div id="modal"></div>
</div>

<script>
let tab='yo';
let gastos=JSON.parse(localStorage.getItem('gastos')||'[]');
let ingresos={yo:250000,ella:240000};

function render(){
 let html='';
 if(tab==='yo'||tab==='ella'){
  const total=gastos.filter(x=>x.quien===tab).reduce((s,x)=>s+x.monto,0);
  html+=`<div class="card">Total: $${total}<br>Ingreso: $${ingresos[tab]}<br>Balance: $${ingresos[tab]-total}</div>`;

  gastos.filter(x=>x.quien===tab).forEach((g,i)=>{
    html+=`<div class="item">${g.icon} ${g.tipo}<span>$${g.monto} <b onclick="del(${i})">❌</b></span></div>`;
  });

  html+=`<div class="add" onclick="openModal('${tab}')">+ agregar</div>`;
 }

 if(tab==='proy'){
  const y=gastos.filter(x=>x.quien==='yo').reduce((s,x)=>s+x.monto,0);
  const e=gastos.filter(x=>x.quien==='ella').reduce((s,x)=>s+x.monto,0);
  ['jun','jul','ago'].forEach(m=>{
    html+=`<div class="card">${m}<br>yo: $${y}<br>ella: $${e}</div>`;
  });
 }

 document.getElementById('content').innerHTML=html;
 localStorage.setItem('gastos',JSON.stringify(gastos));
}

function setTab(t,btn){
 tab=t;
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 render();
}

function del(i){gastos.splice(i,1);render();}

function openModal(q){
 document.getElementById('modal').innerHTML=`
 <div class='modal' onclick="if(event.target.className==='modal')this.innerHTML=''">
  <div class='modal-inner'>
   <select id='tipo'>
    <option>moto</option>
    <option>tarjeta</option>
    <option>salud</option>
   </select>
   <input id='monto' type='number' placeholder='monto'>
   <button onclick="save('${q}')">guardar</button>
  </div>
 </div>`;
}

function save(q){
 const tipo=document.getElementById('tipo').value;
 const monto=parseInt(document.getElementById('monto').value||0);
 const icon={moto:'🏍️',tarjeta:'💳',salud:'💊'}[tipo];
 if(monto){gastos.push({tipo,icon,monto,quien:q});}
 document.getElementById('modal').innerHTML='';
 render();
}

render();
</script>
</body>
</html>
